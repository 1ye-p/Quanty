# BreakoutPullbackStrategy — 突破回踩选股策略 默认配置
# 来源: TDX 通达信公式"突破回踩选股 - 回踩优先版"

[strategy]
type = "BreakoutPullback"
strategy_id = "breakout_pullback_default"

# ── 回看窗口 ──
N = 10                      # 启动大阳搜索范围（天）

# ── 仓位管理 ──
max_positions = 10           # 最大持仓数

# ── 退出参数 ──
[exit]
stop_loss_pct = 0.08         # 回撤止损比例
ma_stop_period = 20          # 均线止损周期
trend_hold_days = 3          # 趋势止损最少持有天数
take_profit_mult = 1.15      # 止盈倍数（相对 MA20）

# ── 入场: MA10 回踩 ──
[entry.touch_ma10]
upper = 1.015                # 低点上限 (MA10 * 1.015)
lower = 0.96                 # 低点下限 (MA10 * 0.96)
close_floor = 0.98           # 收盘下限 (MA10 * 0.98)

# ── 入场: 缩量 ──
[entry.shrink]
ratio = 0.85                 # 当日量 < V5 * 0.85

# ── 入场: 大阳线 (启动大阳) ──
[entry.big_yang]
gain = 0.06                  # 涨幅 >= 6%
body = 0.035                 # 实体涨幅 >= 3.5%
vol_mult = 2.0               # 成交量 > 前5日均量 * 2

# ── 入场: 大阴线 (放量大阴) ──
[entry.big_yin]
drop = 0.03                  # 实体跌幅 >= 3%
vol_mult = 1.5               # 成交量 > 5日均量 * 1.5

# ── 入场: 回踩质量 ──
[entry.pullback]
depth_floor = 0.97           # 最低价 >= 启动实体中点 * 0.97
vol_vs_breakout = 0.6        # 今日量 < 启动日量 * 0.6
rise_upper = 0.12            # 累计涨幅上限 12%
rise_lower = -0.06           # 累计涨幅下限 -6%

# ── 基础过滤 ──
[filter]
price_min = 3.0              # 最低价
price_max = 150.0            # 最高价
min_list_days = 120          # 最少上市天数
