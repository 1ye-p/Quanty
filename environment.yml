name: cQuanty
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip

  # Data & numeric
  - numpy>=1.26
  - pandas>=2.0
  - polars>=1.0
  - pyarrow>=17.0
  - duckdb>=1.1

  # Quantitative research
  - networkx>=3.3
  - xgboost>=2.0
  - lightgbm>=4.0
  - scikit-learn>=1.5

  # Web & API
  - fastapi>=0.111
  - uvicorn>=0.30
  - httpx>=0.27
  - pydantic>=2.7,<3

  # Build tools
  - maturin>=1.5
  - hatchling>=1.25

  # Dev tooling
  - ruff>=0.4
  - mypy>=1.10
  - pytest>=8.2
  - pytest-asyncio>=0.23
  - pre-commit>=3.7

  # ML / experiment tracking
  - mlflow>=2.14

  - pip:
      # CN/US market data
      - akshare>=1.14
      - tushare>=1.4
      - yfinance>=0.2

      # Backtesting
      - vectorbt>=0.25

      # Config loading from .env
      - pydantic-settings>=2.0

      # Testing
      - pytest-snapshot>=0.9

      # Type stubs
      - pandas-stubs
      - types-networkx
